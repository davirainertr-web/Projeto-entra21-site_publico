spring.application.name=texciclo-publico

# Render fornece estas variáveis a partir do PostgreSQL criado pelo render.yaml.
# Os valores abaixo são apenas fallbacks para executar localmente sem configuração adicional.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:texciclo_demo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Render exige que a aplicação escute na porta fornecida pela variável PORT.
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pasta de arquivos da demonstração. No Render Free ela é efêmera;
# os dados relacionais ficam no PostgreSQL.
texciclo.upload-dir=${UPLOAD_DIR:uploads}
texciclo.public.base-url=${PUBLIC_BASE_URL:http://localhost:8080}
texciclo.demo-public=true

# O site público não envia e-mails. O fluxo de demonstração é autocontido.
texciclo.email.admin=${DEMO_EMAIL_ADMIN:demo@texciclo.local}
