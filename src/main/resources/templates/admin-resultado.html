<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resultado — TexCiclo</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

    <link rel="stylesheet"
          th:href="@{/css/platform.css}">

</head>

<body>

<div class="auth-shell">

    <div class="auth-logo">
        Tex<span class="dot">Ciclo</span>
    </div>

    <div class="auth-card resultado-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Ação concluída
        </h1>

        <p class="auth-sub"
           th:text="${mensagem}">
            Cadastro processado com sucesso.
        </p>

        <a th:href="@{/}"
           class="btn btn-primary">
            Voltar ao início
        </a>

    </div>

</div>

</body>

</html>
