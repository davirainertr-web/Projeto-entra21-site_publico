<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — TexCiclo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link rel="stylesheet" th:href="@{/css/platform.css}">
</head>
<body>
<div class="auth-shell">
<a th:href="@{/}" class="auth-back">← Voltar ao site</a>
<div class="auth-logo">Tex<span class="dot">Ciclo</span></div>
<div class="auth-card">
<h1>Entrar na plataforma</h1>
<div class="auth-success" th:if="${param.pendente}" style="display:block; margin-bottom:16px; padding:12px 14px; border-radius:2px; background:rgba(31,59,54,0.08); border:1px solid var(--teal); color:var(--teal); font-size:0.85rem;">
<strong>Cadastro enviado com sucesso!</strong><br>
Estamos analisando suas informações. Você receberá a confirmação por e-mail após a análise.
</div>
<div class="auth-error" th:if="${erro}" th:text="${erro}" style="display:block; margin-bottom:18px; padding:10px 14px; border-radius:2px; background:rgba(167,56,43,0.1); border:1px solid rgba(167,56,43,0.35); color:#7f291f; font-size:0.85rem;"></div>
<p class="auth-sub">Acesse sua conta para continuar.</p>
<form id="loginForm" th:action="@{/login}" method="post">
<div class="field"><label for="loginEmail">E-mail</label><input type="email" id="loginEmail" name="email" placeholder="voce@empresa.com.br" autocomplete="email" required></div>
<div class="field"><label for="loginSenha">Senha</label><input type="password" id="loginSenha" name="senha" placeholder="••••••••" autocomplete="current-password" required></div>
<button type="submit" class="btn btn-primary auth-submit">Entrar</button>
</form>
<div class="login-register"><span>Ainda não possui uma conta?</span><a th:href="@{/cadastro}">Criar uma conta</a></div>
<div style="margin-top:18px; padding-top:16px; border-top:1px solid var(--line); text-align:center;">
<a th:href="@{/teste-perfis}" style="font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--teal);">Conheça a plataforma sem criar conta →</a>
</div>
</div>
</div>
<script th:src="@{/js/platform.js}"></script>
</body>
</html>
